<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>律师见证书查验</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet" />
  <script>
    window.VERIFY_PAGE_CONFIG = {
      apiBase: 'http://127.0.0.1:8080'
    };
  </script>
  <style>
    :root {
      --ink: #14241d;
      --ink-soft: #2a3f35;
      --forest: #1f5c45;
      --forest-deep: #0f3a2c;
      --seal: #a67c2d;
      --seal-soft: #c9a24a;
      --mist: #e4ece7;
      --paper: #f3f7f4;
      --line: rgba(20, 36, 29, 0.12);
      --muted: #5b6b63;
      --btn: #1f5c45;
      --btn-dark: #164533;
      --danger: #8f1d1d;
      --warn: #9a5b00;
      --ok: #1b6b45;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans SC', 'PingFang SC', 'Hiragino Sans GB', sans-serif;
      color: var(--ink);
      min-height: 100vh;
      background:
        radial-gradient(ellipse 120% 70% at 50% -10%, rgba(31, 92, 69, 0.18), transparent 55%),
        linear-gradient(165deg, #d7e4dc 0%, var(--mist) 38%, #edf2ef 100%);
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.035;
      background-image:
        repeating-linear-gradient(
          -18deg,
          transparent,
          transparent 11px,
          rgba(20, 36, 29, 0.55) 11px,
          rgba(20, 36, 29, 0.55) 12px
        );
      z-index: 0;
    }
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .hero {
      padding: 28px 20px 22px;
      text-align: center;
      color: #f7fbf8;
      background:
        linear-gradient(160deg, rgba(15, 58, 44, 0.96) 0%, rgba(20, 70, 52, 0.92) 48%, rgba(18, 48, 38, 0.97) 100%),
        radial-gradient(circle at 80% 20%, rgba(201, 162, 74, 0.22), transparent 42%);
      border-bottom: 3px solid var(--seal-soft);
      animation: heroIn 0.7s ease-out both;
    }
    .hero-kicker {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(247, 251, 248, 0.72);
      margin-bottom: 14px;
    }
    .hero-brand {
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      font-size: clamp(22px, 5.6vw, 28px);
      font-weight: 700;
      letter-spacing: 0.06em;
      line-height: 1.35;
    }
    .hero-title {
      margin-top: 10px;
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.12em;
      color: rgba(247, 251, 248, 0.9);
    }
    .hero-desc {
      margin: 14px auto 0;
      max-width: 320px;
      font-size: 13px;
      line-height: 1.7;
      color: rgba(247, 251, 248, 0.78);
    }
    .seal-row {
      margin-top: 18px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .seal-chip {
      font-size: 11px;
      letter-spacing: 0.08em;
      padding: 6px 12px;
      border: 1px solid rgba(201, 162, 74, 0.55);
      color: #f3e6c2;
      background: rgba(166, 124, 45, 0.16);
    }
    .redirect-tip {
      display: none;
      margin: 0;
      padding: 11px 16px;
      background: rgba(31, 92, 69, 0.1);
      border-bottom: 1px solid rgba(31, 92, 69, 0.18);
      color: var(--forest-deep);
      font-size: 13px;
      line-height: 1.6;
      text-align: center;
    }
    .redirect-tip a {
      color: var(--forest);
      font-weight: 600;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .main {
      flex: 1;
      max-width: 520px;
      width: 100%;
      margin: 0 auto;
      padding: 18px 16px 36px;
    }
    .loading, .error-box {
      text-align: center;
      padding: 52px 16px;
      font-size: 14px;
      color: var(--muted);
    }
    .error-box { color: var(--danger); }
    .trust-block {
      margin-bottom: 14px;
      padding: 16px 16px 14px;
      border-left: 3px solid var(--seal);
      background: rgba(243, 247, 244, 0.88);
      animation: riseIn 0.55s ease-out 0.12s both;
    }
    .trust-block h2 {
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--ink);
      margin-bottom: 8px;
    }
    .trust-block p {
      font-size: 13px;
      line-height: 1.75;
      color: var(--ink-soft);
    }
    .verdict {
      position: relative;
      overflow: hidden;
      padding: 18px 16px 16px;
      margin-bottom: 14px;
      color: #fff;
      animation: riseIn 0.6s ease-out 0.2s both;
    }
    .verdict::after {
      content: '';
      position: absolute;
      right: -18px;
      top: -28px;
      width: 110px;
      height: 110px;
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      transform: rotate(12deg);
    }
    .verdict.green { background: linear-gradient(145deg, #1b6b45 0%, #145338 100%); }
    .verdict.yellow { background: linear-gradient(145deg, #b87a12 0%, #8a5200 100%); }
    .verdict.red { background: linear-gradient(145deg, #a12d2d 0%, #7a1818 100%); }
    .verdict-label {
      font-size: 11px;
      letter-spacing: 0.22em;
      opacity: 0.8;
      margin-bottom: 8px;
    }
    .verdict-title {
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .verdict-desc {
      font-size: 13px;
      line-height: 1.6;
      opacity: 0.95;
      margin-bottom: 14px;
    }
    .verdict-meta {
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.25);
      font-size: 13px;
      line-height: 1.75;
    }
    .verdict-meta span {
      opacity: 0.78;
      margin-right: 4px;
    }
    .cert-panel {
      margin-bottom: 14px;
      padding: 14px;
      background: rgba(243, 247, 244, 0.92);
      border: 1px solid var(--line);
      animation: riseIn 0.6s ease-out 0.28s both;
    }
    .cert-panel-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .cert-panel-head h3 {
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.08em;
    }
    .cert-panel-head span {
      font-size: 11px;
      color: var(--seal);
      letter-spacing: 0.08em;
    }
    .cert-panel img {
      display: block;
      width: 100%;
      max-height: 68vh;
      object-fit: contain;
      cursor: zoom-in;
      background: #fff;
      border: 1px solid var(--line);
    }
    .cert-image-hint {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
    }
    .preview-empty {
      margin: 0 0 14px;
      padding: 28px 12px;
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      background: rgba(243, 247, 244, 0.92);
      border: 1px dashed var(--line);
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: riseIn 0.6s ease-out 0.36s both;
    }
    .btn {
      display: block;
      width: 100%;
      height: 46px;
      line-height: 46px;
      text-align: center;
      font-size: 15px;
      letter-spacing: 0.04em;
      border: none;
      cursor: pointer;
      text-decoration: none;
      font-family: inherit;
    }
    .btn-primary {
      background: var(--btn);
      color: #fff;
    }
    .btn-primary:active { background: var(--btn-dark); }
    .btn-outline {
      background: transparent;
      color: var(--forest);
      border: 1px solid rgba(31, 92, 69, 0.45);
    }
    .btn-outline:active {
      background: rgba(31, 92, 69, 0.08);
    }
    .page-footer {
      padding: 22px 16px 30px;
      text-align: center;
      border-top: 1px solid var(--line);
      background: rgba(243, 247, 244, 0.75);
    }
    .page-footer .firm {
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--ink);
    }
    .page-footer .note {
      margin-top: 8px;
      font-size: 12px;
      line-height: 1.6;
      color: var(--muted);
    }
    .link-verify {
      display: block;
      margin-top: 16px;
      text-align: center;
      font-size: 13px;
      color: var(--forest);
      text-decoration: none;
    }
    .toast {
      display: none;
      position: fixed;
      left: 50%;
      bottom: 80px;
      transform: translateX(-50%);
      max-width: 80%;
      padding: 10px 16px;
      background: rgba(20, 36, 29, 0.88);
      color: #fff;
      font-size: 14px;
      z-index: 2000;
      text-align: center;
    }
    .toast.is-show { display: block; }
    .modal-mask {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(14, 28, 22, 0.55);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .modal-mask.is-show { display: flex; }
    .modal-box {
      background: #f7faf8;
      padding: 24px 20px;
      max-width: 340px;
      width: 100%;
      border-top: 3px solid var(--seal);
    }
    .modal-box h3 {
      font-family: 'Noto Serif SC', 'Songti SC', serif;
      font-size: 17px;
      margin-bottom: 12px;
      text-align: center;
      letter-spacing: 0.06em;
    }
    .modal-box p {
      font-size: 14px;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 18px;
    }
    .modal-actions { display: flex; gap: 10px; }
    .modal-actions .btn { flex: 1; height: 40px; line-height: 40px; font-size: 14px; }
    .modal-actions .btn-cancel {
      background: #e8eee9;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 3000;
      background: rgba(10, 20, 16, 0.9);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .lightbox.is-show { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
    }
    .lightbox-close {
      position: absolute;
      top: 14px;
      right: 16px;
      color: #fff;
      font-size: 28px;
      line-height: 1;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    @keyframes heroIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes riseIn {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <div class="hero-kicker">LAWYER WITNESSED · TRACEABLE</div>
      <div class="hero-brand" id="firmName">浙江沐尘律师事务所</div>
      <div class="hero-title">律师见证书查验</div>
      <p class="hero-desc">本证书由执业律师出具，种植与采收过程均有律师全程现场监督，具备相应法律证明效力。</p>
      <div class="seal-row">
        <span class="seal-chip">全程监督</span>
        <span class="seal-chip">安全溯源</span>
        <span class="seal-chip">法律见证</span>
      </div>
    </header>
    <div class="redirect-tip" id="redirectTip"></div>
    <main class="main" id="mainContent">
      <div class="loading" id="loadingTip">正在核验见证书信息…</div>
    </main>
    <footer class="page-footer">
      <p class="firm">见证律所：浙江沐尘律师事务所</p>
      <p class="note">扫码结果仅对当前查询码对应批次有效，请结合见证书原文核对。</p>
    </footer>
  </div>

  <div id="toast" class="toast"></div>

  <div class="lightbox" id="imageLightbox">
    <button type="button" class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
    <img id="lightboxImage" alt="见证书大图" />
  </div>

  <div class="modal-mask" id="pdfModal">
    <div class="modal-box">
      <h3>如何下载 PDF</h3>
      <p>请使用系统浏览器打开 PDF 页面。在微信、支付宝内请先点右上角「…」，选择「在浏览器中打开」；打开后使用浏览器菜单中的「下载」或「分享 → 存储到文件」完成保存。</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-cancel" id="pdfModalCancel">取消</button>
        <button type="button" class="btn btn-primary" id="pdfModalConfirm">去打开</button>
      </div>
    </div>
  </div>

  <script>
    (function () {
      var CFG = window.VERIFY_PAGE_CONFIG || {};
      var API_BASE = (CFG.apiBase || '').replace(/\/$/, '');
      var pendingPdfUrl = '';
      var verifyData = {};
      var siteConfigData = {};
      var redirectTimer = null;
      var redirectCountdownTimer = null;
      var BASE_DETAIL_EMPTY_MSG = '该基地暂无介绍';

      function $(id) { return document.getElementById(id); }

      function showToast(msg) {
        var el = $('toast');
        el.textContent = msg;
        el.classList.add('is-show');
        setTimeout(function () { el.classList.remove('is-show'); }, 2500);
      }

      function resolveFileUrl(path) {
        if (!path) return '';
        if (/^https?:\/\//i.test(path)) return path;
        return API_BASE + (path.charAt(0) === '/' ? path : '/' + path);
      }

      function escapeAttr(s) {
        return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;');
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function apiGet(url) {
        return fetch(API_BASE + url, { method: 'GET', headers: { 'Content-Type': 'application/json' } })
          .then(function (res) {
            if (!res.ok) {
              return res.text().then(function (text) {
                throw new Error('HTTP ' + res.status + (text ? ': ' + text.slice(0, 120) : ''));
              });
            }
            return res.json();
          });
      }

      function applySiteConfig(data) {
        siteConfigData = data || {};
        if (siteConfigData.firmName) {
          $('firmName').textContent = siteConfigData.firmName;
          var firmLine = document.querySelector('.page-footer .firm');
          if (firmLine) firmLine.textContent = '见证律所：' + siteConfigData.firmName;
        }
      }

      function clearRedirectTimers() {
        if (redirectTimer) {
          clearTimeout(redirectTimer);
          redirectTimer = null;
        }
        if (redirectCountdownTimer) {
          clearInterval(redirectCountdownTimer);
          redirectCountdownTimer = null;
        }
      }

      function normalizeRedirectUrl(url) {
        if (!url) return '';
        var u = String(url).trim();
        if (!u) return '';
        if (!/^https?:\/\//i.test(u) && u.charAt(0) !== '/') {
          u = 'https://' + u;
        }
        return u;
      }

      function scheduleRedirect() {
        clearRedirectTimers();
        var tip = $('redirectTip');
        var target = normalizeRedirectUrl(siteConfigData.redirectUrl);
        if (!target) {
          if (tip) tip.style.display = 'none';
          return;
        }
        var delay = siteConfigData.redirectDelaySeconds;
        if (delay == null || delay === '' || isNaN(Number(delay))) delay = 6;
        delay = Math.max(0, Number(delay));
        var left = delay;
        function renderTip() {
          if (!tip) return;
          if (delay === 0) {
            tip.innerHTML = '正在跳转… <a href="' + escapeAttr(target) + '">立即前往</a>';
            return;
          }
          tip.innerHTML = left + ' 秒后自动跳转… <a href="' + escapeAttr(target) + '">立即前往</a>';
        }
        if (tip) {
          tip.style.display = 'block';
          renderTip();
        }
        if (delay === 0) {
          window.location.href = target;
          return;
        }
        redirectCountdownTimer = setInterval(function () {
          left -= 1;
          if (left <= 0) {
            clearInterval(redirectCountdownTimer);
            redirectCountdownTimer = null;
          }
          renderTip();
        }, 1000);
        redirectTimer = setTimeout(function () {
          window.location.href = target;
        }, delay * 1000);
      }

      var VERIFY_NOT_FOUND_MSG = '未能查到对应的见证书，请核实查询码后重试。';

      function normalize(data) {
        data = data || {};
        if (data.verified || data.status === 2) {
          data.verified = true;
          return data;
        }
        data.verified = false;
        data.message = VERIFY_NOT_FOUND_MSG;
        return data;
      }

      function getQueryCode() {
        return new URLSearchParams(window.location.search).get('code') || '';
      }

      function showPdfTipModal(url) {
        pendingPdfUrl = url;
        $('pdfModal').classList.add('is-show');
      }

      function hidePdfTipModal() {
        $('pdfModal').classList.remove('is-show');
        pendingPdfUrl = '';
      }

      function openLightbox(url) {
        $('lightboxImage').src = url;
        $('imageLightbox').classList.add('is-show');
      }

      function closeLightbox() {
        $('imageLightbox').classList.remove('is-show');
        $('lightboxImage').removeAttribute('src');
      }

      $('pdfModalCancel').addEventListener('click', hidePdfTipModal);
      $('pdfModal').addEventListener('click', function (e) {
        if (e.target === $('pdfModal')) hidePdfTipModal();
      });
      $('pdfModalConfirm').addEventListener('click', function () {
        if (pendingPdfUrl) window.open(pendingPdfUrl, '_blank', 'noopener');
        hidePdfTipModal();
      });
      $('lightboxClose').addEventListener('click', closeLightbox);
      $('imageLightbox').addEventListener('click', function (e) {
        if (e.target === $('imageLightbox')) closeLightbox();
      });

      function formatScanTime(v) {
        if (!v) return '-';
        if (typeof v === 'string') return v.replace('T', ' ').slice(0, 19);
        return String(v);
      }

      function colorClass(color) {
        var c = (color || 'GREEN').toUpperCase();
        if (c === 'RED') return 'red';
        if (c === 'YELLOW') return 'yellow';
        return 'green';
      }

      function colorTitle(color) {
        var c = (color || 'GREEN').toUpperCase();
        if (c === 'RED') return '红码 · 多次扫码风险';
        if (c === 'YELLOW') return '黄码 · 非首次扫码';
        return '绿码 · 正品鉴证';
      }

      function formatDateOnly(v) {
        if (!v) return '';
        if (typeof v === 'string') return v.slice(0, 10);
        return String(v);
      }

      function renderVerified(data) {
        verifyData = data || {};
        var imgPath = verifyData.certImage || '';
        var imgUrl = imgPath ? resolveFileUrl(imgPath) : '';
        var pdfUrl = verifyData.certFile ? resolveFileUrl(verifyData.certFile) : '';
        var videoUrl = verifyData.videoUrl ? resolveFileUrl(verifyData.videoUrl) : '';
        var cls = colorClass(verifyData.codeColor);
        var isRice = (verifyData.productType || '') === 'rice';
        var productName = verifyData.productName || (isRice ? '五常大米' : '杨梅');
        var html = '';

        html += '<section class="trust-block">';
        if (isRice) {
          html += '<h2>' + escapeHtml(productName) + ' · 律师全程见证</h2>';
          html += '<p>本批次大米在收割、加工包装与仓储环节均有执业律师现场参与监督；见证书由律师事务所依法出具，可用于追溯来源与核验真伪。</p>';
        } else {
          html += '<h2>' + escapeHtml(productName) + ' · 律师全程见证</h2>';
          html += '<p>本批次农产品在种植、采摘与出证环节均有执业律师现场参与监督；见证书由律师事务所依法出具，可用于追溯来源与核验真伪。</p>';
        }
        html += '</section>';

        html += '<section class="verdict ' + cls + '">';
        html += '<div class="verdict-label">查验结论</div>';
        html += '<div class="verdict-title">' + escapeHtml(colorTitle(verifyData.codeColor)) + '</div>';
        html += '<div class="verdict-desc">' + escapeHtml(verifyData.message || '') + '</div>';
        html += '<div class="verdict-meta">';
        html += '<div><span>查询码</span>' + escapeHtml(verifyData.code || '-') + '</div>';
        html += '<div><span>产品</span>' + escapeHtml(productName) + '</div>';
        html += '<div><span>扫码次数</span>' + escapeHtml(verifyData.scanCount != null ? String(verifyData.scanCount) : '-') + '</div>';
        html += '<div><span>首次扫码</span>' + escapeHtml(formatScanTime(verifyData.firstScanAt)) + '</div>';
        if (verifyData.batchName) {
          html += '<div><span>批次</span>' + escapeHtml(verifyData.batchName) + '</div>';
        }
        if (verifyData.lawyerName) {
          html += '<div><span>见证律师</span>' + escapeHtml(verifyData.lawyerName) + '</div>';
        }
        if (verifyData.origin) {
          html += '<div><span>产地</span>' + escapeHtml(verifyData.origin) + '</div>';
        }
        if (isRice) {
          if (verifyData.processor) {
            html += '<div><span>加工包装厂家</span>' + escapeHtml(verifyData.processor) + '</div>';
          }
          if (verifyData.warehouse) {
            html += '<div><span>仓库</span>' + escapeHtml(verifyData.warehouse) + '</div>';
          }
          if (verifyData.harvestDate) {
            html += '<div><span>收割时间</span>' + escapeHtml(formatDateOnly(verifyData.harvestDate)) + '</div>';
          }
          if (verifyData.processDate) {
            html += '<div><span>加工时间</span>' + escapeHtml(formatDateOnly(verifyData.processDate)) + '</div>';
          }
        } else {
          if (verifyData.pickDate) {
            html += '<div><span>采摘日期</span>' + escapeHtml(formatDateOnly(verifyData.pickDate)) + '</div>';
          }
          if (verifyData.packDate) {
            html += '<div><span>包装日期</span>' + escapeHtml(formatDateOnly(verifyData.packDate)) + '</div>';
          }
        }
        html += '</div></section>';

        if (imgUrl) {
          html += '<section class="cert-panel">';
          html += '<div class="cert-panel-head"><h3>律师见证书</h3><span>ORIGINAL</span></div>';
          html += '<img id="certPreviewImage" src="' + escapeAttr(imgUrl) + '" alt="见证书图片" />';
          html += '<p class="cert-image-hint">点击图片可查看大图</p>';
          html += '</section>';
        } else {
          html += '<p class="preview-empty">暂无见证书图片</p>';
        }

        html += '<div class="btn-row">';
        if (pdfUrl) {
          html += '<button type="button" class="btn btn-primary" id="btnDownloadPdf">下载见证书 PDF</button>';
        }
        if (!isRice) {
          html += '<button type="button" class="btn btn-outline" id="btnBaseDetail">查看产品生产基地资料</button>';
        }
        if (videoUrl) {
          html += '<a class="btn btn-outline" id="btnVideo" href="' + escapeAttr(videoUrl) + '" target="_blank" rel="noopener">查看溯源视频</a>';
        }
        html += '</div>';

        $('mainContent').innerHTML = html;

        if (imgUrl && $('certPreviewImage')) {
          $('certPreviewImage').addEventListener('click', function () {
            openLightbox(imgUrl);
          });
        }
        if (pdfUrl && $('btnDownloadPdf')) {
          $('btnDownloadPdf').addEventListener('click', function () { showPdfTipModal(pdfUrl); });
        }
        if ($('btnBaseDetail')) {
          $('btnBaseDetail').addEventListener('click', function () {
            var url = (verifyData.baseDetailUrl || '').trim();
            if (url) {
              window.open(url, '_blank', 'noopener');
              return;
            }
            showToast(BASE_DETAIL_EMPTY_MSG);
          });
        }

        scheduleRedirect();
      }

      function renderError(msg) {
        clearRedirectTimers();
        var tip = $('redirectTip');
        if (tip) tip.style.display = 'none';
        $('mainContent').innerHTML = '<div class="error-box">' + (msg || '加载失败') + '</div>' +
          '<a class="link-verify" href="/index.html">前往查验页</a>';
      }

      function load() {
        var code = getQueryCode();
        if (!code) {
          renderError('缺少查询码参数');
          return;
        }
        var configPromise = apiGet('/ym/siteConfig/public').catch(function () { return null; });
        var verifyPromise = apiGet('/ym/certificate/public/verify?code=' + encodeURIComponent(code));
        Promise.all([configPromise, verifyPromise])
          .then(function (results) {
            var configRes = results[0];
            var verifyRes = results[1];
            if (configRes && configRes.code === 200 && configRes.data) {
              applySiteConfig(configRes.data);
            }
            if (!verifyRes || verifyRes.code !== 200) {
              renderError((verifyRes && verifyRes.msg) || '查询失败');
              return;
            }
            var data = normalize(verifyRes.data);
            if (data.verified) {
              renderVerified(data);
            } else {
              renderError(data.message || VERIFY_NOT_FOUND_MSG);
            }
          })
          .catch(function (err) {
            console.error('scan verify failed:', err);
            renderError('网络异常，请稍后重试');
          });
      }

      load();
    })();
  </script>
</body>
</html>
